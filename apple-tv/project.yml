# Ember for Apple TV. This file describes the Xcode project; EmberTV.xcodeproj is generated from it.
# After adding or removing files, regenerate with: xcodegen generate   (brew install xcodegen)
name: EmberTV
options:
  bundleIdPrefix: app.ember
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  EmberKit:
    path: EmberKit
targets:
  EmberTV:
    type: application
    platform: tvOS
    sources:
      - path: EmberTV
        excludes:
          - "**/*.txt"
      - path: EmberTV/Resources/Fonts/Figtree-OFL.txt
        buildPhase: resources
      - path: EmberTV/Resources/Fonts/BricolageGrotesque-OFL.txt
        buildPhase: resources
    dependencies:
      - package: EmberKit
    info:
      path: EmberTV/Info.plist
      properties:
        CFBundleDisplayName: Ember
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        UIAppFonts:
          - Figtree-Regular.ttf
          - Figtree-Medium.ttf
          - Figtree-SemiBold.ttf
          - Figtree-Bold.ttf
          - Figtree-ExtraBold.ttf
          - BricolageGrotesque-SemiBold.ttf
          - BricolageGrotesque-ExtraBold.ttf
        # Home servers are often plain http on the local network (http://hearth:8096).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Ember connects to your Jellyfin and Seerr servers on your home network.
        LSApplicationQueriesSchemes: [youtube]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ember.tv
        PRODUCT_NAME: Ember
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  EmberTV:
    build:
      targets:
        EmberTV: all
    run:
      config: Debug
    archive:
      config: Release
