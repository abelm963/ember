# Temporary: checks that Ember finds trailer streams on its own, from GitHub's machines.
name: Trailer probe
on:
  push:
    branches: ['claude/trailer-probe']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
      - run: flutter pub get
      - run: dart run tool/trailer_probe.dart giXco2jaZ_4 d9MyW72ELq0 Way9Dexny3w 8g18jFHCLXk dQw4w9WgXcQ
