# Runs Ember's code checks on a Linux machine: formatting, the analyzer and the tests.
# Builds for Apple TV are in apple-tv.yml; Windows is built on the owner's PC (Update Ember.bat).

name: Checks

on:
  push:
    branches: [apple-tv, main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Same Flutter as the Windows PC and the Apple TV build (flutter-tvos pins 3.47.8).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.8
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyzer
        run: flutter analyze

      - name: Tests
        run: flutter test
